apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-manager-worker
  namespace: dns-manager
  labels:
    app.kubernetes.io/name: dns-manager
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-manager
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-manager
        app.kubernetes.io/component: worker
    spec:
      # Let in-flight jobs finish on rollout (queue:work traps SIGTERM)
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          # Replace OWNER with your GitHub username/org
          image: ghcr.io/OWNER/dns-manager:latest
          imagePullPolicy: Always
          # Goes through the image entrypoint so caches are built first
          command: ["docker-entrypoint"]
          args:
            - php
            - artisan
            - queue:work
            - redis
            - --tries=3
            - --max-time=3600
          envFrom:
            - configMapRef:
                name: dns-manager-config
            - secretRef:
                name: dns-manager-secrets
          # Process-based liveness: restart if the worker process dies
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "queue:work"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
