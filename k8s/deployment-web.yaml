apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-manager-web
  namespace: dns-manager
  labels:
    app.kubernetes.io/name: dns-manager
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-manager
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-manager
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          # Replace OWNER with your GitHub username/org
          image: ghcr.io/OWNER/dns-manager:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: dns-manager-config
            - secretRef:
                name: dns-manager-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # entrypoint writes bootstrap/cache
