apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dns-manager

resources:
  - namespace.yaml
  - configmap.yaml
  # Copy secret.example.yaml -> secret.yaml with real values first,
  # then either uncomment the line below or create the secret manually
  # (see the header of secret.example.yaml). Never commit secret.yaml.
  # - secret.yaml
  - deployment-web.yaml
  - deployment-worker.yaml
  - deployment-scheduler.yaml
  - service.yaml
  - ingress.yaml
  # Jobs are immutable: delete the finished job before re-applying
  # (kubectl -n dns-manager delete job dns-manager-migrate)
  - job-migrate.yaml
