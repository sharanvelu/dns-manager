apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: kustomize's `namespace:` transformer only sets metadata.namespace on
# the resources below — it does NOT create the namespace. Create it once:
#   kubectl create namespace dns-manager
namespace: dns-manager

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # Copy secret.example.yaml -> secret.yaml with real values first, then
  # uncomment (or create the secret manually — see secret.example.yaml).
  # Never commit secret.yaml.
  # - secret.yaml
  # Optional PVC for persistent storage/app (also uncomment the volume
  # blocks in deployment.yaml):
  # - volume.yaml
  # Optional k8s-native drift-check scheduler (set SCHEDULER_ENABLED=false
  # in the ConfigMap if you enable this):
  # - cronjob.yaml
