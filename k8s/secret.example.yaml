# TEMPLATE ONLY — copy to secret.yaml, fill in real values, and NEVER
# commit secret.yaml (add it to .gitignore). Alternatively create it
# imperatively:
#
#   kubectl -n dns-manager create secret generic dns-manager-secrets \
#     --from-literal=APP_KEY="$(php artisan key:generate --show)" \
#     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=OIDC_BASE_URL=... --from-literal=OIDC_CLIENT_ID=... \
#     --from-literal=OIDC_CLIENT_SECRET=... \
#     --from-literal=OIDC_REDIRECT_URI=https://dns.example.com/auth/callback
apiVersion: v1
kind: Secret
metadata:
  name: dns-manager-secrets
  labels:
    app.kubernetes.io/name: dns-manager
type: Opaque
stringData:
  # Generate with: php artisan key:generate --show
  APP_KEY: "base64:CHANGEME"
  DB_USERNAME: "dns_manager"
  DB_PASSWORD: "CHANGEME"
  REDIS_PASSWORD: "CHANGEME"
  OIDC_BASE_URL: "https://sso.example.com/realms/homelab"
  OIDC_CLIENT_ID: "dns-manager"
  OIDC_CLIENT_SECRET: "CHANGEME"
  OIDC_REDIRECT_URI: "https://dns.example.com/auth/callback"
  # Bearer token for POST /api/hooks/drift-check and /api/hooks/health-check
  # (external automation, e.g. N8N). Leave empty to keep the endpoints
  # disabled.
  HOOKS_TRIGGER_TOKEN: ""
