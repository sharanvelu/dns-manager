# ============================================================================
# STANDALONE manifest for the DNS Manager documentation site.
#
# NOT part of the app kustomization (k8s/kustomization.yaml) — the docs site
# is a separate, purely static nginx deployment built from docs-site/.
# Apply directly:
#
#   kubectl apply -f k8s/docs-site.yaml
#
# Replace the OWNER placeholder in the image and the Ingress host before use.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-manager-docs
  labels:
    app.kubernetes.io/name: dns-manager-docs
    app.kubernetes.io/component: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-manager-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-manager-docs
        app.kubernetes.io/component: docs
    spec:
      containers:
        - name: docs
          image: ghcr.io/OWNER/dns-manager-docs:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: dns-manager-docs
  labels:
    app.kubernetes.io/name: dns-manager-docs
spec:
  selector:
    app.kubernetes.io/name: dns-manager-docs
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dns-manager-docs
  labels:
    app.kubernetes.io/name: dns-manager-docs
spec:
  rules:
    - host: docs.dns.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dns-manager-docs
                port:
                  name: http
