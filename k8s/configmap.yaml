apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-manager-config
  labels:
    app.kubernetes.io/name: dns-manager
data:
  APP_NAME: "DNS Manager"
  APP_ENV: "production"
  APP_DEBUG: "false"
  # Must match the ingress host
  APP_URL: "https://dns.example.com"
  # TLS terminates at the ingress, so the pod is reached over plain http —
  # force generated URLs (assets, redirects) to https to avoid mixed content.
  FORCE_HTTPS: "true"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"

  DB_CONNECTION: "pgsql"
  # Point at your Postgres 16 service (in-cluster DNS or external host)
  DB_HOST: "postgres.databases.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "dns_manager"

  # Point at your Redis service
  REDIS_HOST: "redis.databases.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_CLIENT: "predis"

  QUEUE_CONNECTION: "redis"
  CACHE_STORE: "redis"
  SESSION_DRIVER: "database"

  OIDC_PROVIDER_LABEL: "SSO"

  # Public docs site for the LATEST version (linked from the /docs banner).
  DOCS_SITE_URL: "https://docs.dns.example.com"

  # Migrations run automatically at pod start (the entrypoint runs
  # `php artisan migrate --force`). There is no separate migrate Job in
  # this single-pod architecture.
  AUTO_MIGRATE: "true"

  # Built-in drift-check schedule (see also DRIFT_CHECK_TRIGGER_TOKEN in the
  # Secret for external triggering). Set SCHEDULER_ENABLED to "false" if you
  # switch to the optional cronjob.yaml.
  SCHEDULER_ENABLED: "true"
  DRIFT_CHECK_CRON: "*/15 * * * *"
