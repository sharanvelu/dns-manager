# Database migration Job — run once per deploy:
#   kubectl -n dns-manager delete job dns-manager-migrate --ignore-not-found
#   kubectl apply -f k8s/job-migrate.yaml
# (Jobs are immutable, so delete before re-applying. If this moves to
# Helm later, convert it to a pre-upgrade hook instead.)
apiVersion: batch/v1
kind: Job
metadata:
  name: dns-manager-migrate
  namespace: dns-manager
  labels:
    app.kubernetes.io/name: dns-manager
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-manager
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # Replace OWNER with your GitHub username/org
          image: ghcr.io/OWNER/dns-manager:latest
          imagePullPolicy: Always
          command: ["docker-entrypoint"]
          args:
            - php
            - artisan
            - migrate
            - --force
          envFrom:
            - configMapRef:
                name: dns-manager-config
            - secretRef:
                name: dns-manager-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
