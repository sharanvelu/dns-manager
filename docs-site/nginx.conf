# Serves the Next.js static export with clean URLs.
# Pages are exported as /{slug}/index.html (trailingSlash: true).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Hashed immutable build assets.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # /providers -> /providers/ -> /providers/index.html
        try_files $uri $uri/ =404;
    }
}
