# Categories for auto-generated release notes (`gh release create
# --generate-notes`, run by tag.yml). GitHub groups merged PRs by label;
# PRs matching no category land under "Other changes".
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
