# Dependency review: fails a PR that introduces or upgrades to a dependency
# (composer or npm) with a known vulnerability, and posts a summary comment
# on failure. Only diffs dependencies changed BY the PR — pre-existing
# vulnerabilities in the tree don't fail this check.
# Requires the repository's dependency graph to be enabled
# (Settings → Advanced Security → Dependency graph).
# Deliberately NOT path-filtered: the action itself no-ops fast when no
# manifests changed, and keeping it unconditional keeps the required check
# simple (no gate job needed).
name: dependency-review

on:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
