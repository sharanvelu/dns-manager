# Builds and publishes the standalone docs-site image
# (ghcr.io/<owner>/dns-manager-docs). Separate from build.yml, which
# builds the application image.
name: docs-site

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - "docs/content/**"
      - "VERSION"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-docs" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs-site/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=docs-site
          cache-to: type=gha,mode=max,scope=docs-site
