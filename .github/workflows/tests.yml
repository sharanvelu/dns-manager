name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Tests run on sqlite :memory: (phpunit.xml) and never hit the
      # network (Http::preventStrayRequests in TestCase) — no services,
      # no built assets (TestCase uses withoutVite) needed.
      - name: Run Tests
        run: ./vendor/bin/pest
