# Coding-style gate: runs on every PR targeting master. Check-only — CI
# never rewrites code. Run the fixers locally instead (composer fix-style,
# npm run fix-style, npm run format).
name: code-style

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Pint (check only)
        run: composer run check-style

  js:
    name: JS Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint (check only)
        run: npm run check-style

      - name: Prettier (format check)
        run: npm run format:check
