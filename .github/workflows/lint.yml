name: lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Check-only: CI never rewrites code. Run the fixers locally instead
      # (vendor/bin/pint --dirty, npm run format, npm run lint).
      - name: Pint (PHP style)
        run: vendor/bin/pint --test

      - name: Prettier (format check)
        run: npm run format:check

      - name: ESLint
        run: npx eslint .

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vite Build
        run: npm run build
