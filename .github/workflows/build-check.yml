# Build sanity gate: changes → work → gate. "Build Check Gate" is the
# required check. The frontend build runs when frontend inputs changed;
# the Docker image build (no push) only when the image definition changed
# (Dockerfile or docker/), since it is by far the slowest job. build.yml
# does the real multi-arch build after merge.
name: build-check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.frontend }}
      docker: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docker }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - 'resources/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vite.config.js'
              - '.github/workflows/build-check.yml'
              - '.github/actions/setup/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker/**'
              - 'docs-site/**'
              - '.github/workflows/build-check.yml'

  frontend:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          php: 'false'

      - name: Vite Build
        run: npm run build

  docker:
    name: Docker Build Check
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Single platform and no push — this only proves the image still
      # builds; build.yml does the real multi-arch build after merge.
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=build-amd64

  gate:
    name: Build Check Gate
    needs: [changes, frontend, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All good
        run: echo "All build jobs succeeded or were skipped as not relevant."
