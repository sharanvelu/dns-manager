# Auto-version-and-tag: every merge to master that touches app code becomes
# a release. If the PR already bumped VERSION, that version is tagged as-is;
# otherwise the patch component is bumped, committed, and tagged. The v* tag
# push then triggers build.yml (semver image tags).
#
# Pushes authenticate with the DEPLOY_KEY secret (SSH deploy key with write
# access) whose actor is in the "Protected Branch" ruleset's bypass list —
# required-status-checks blocks any direct-to-master push otherwise, and
# GITHUB_TOKEN pushes would not trigger build.yml (GITHUB_TOKEN events don't
# chain into other workflows). Deploy keys are SSH-only (no API access), so
# the bump commit is a plain git commit; it shows as Unverified because the
# bypass skips the required-signatures rule rather than satisfying it.
name: tag

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Version and Tag
    # Skip the push event generated by this workflow's own bump commit.
    if: "github.repository_owner == 'sharanvelu' && !startsWith(github.event.head_commit.message, 'chore: bump VERSION')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        # The deploy key persists deliberately: this job pushes a bump
        # commit and a tag back to master.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Decide whether this merge needs a release
        id: decide
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          before="$BEFORE_SHA"
          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before" 2>/dev/null; then
            before=$(git rev-parse HEAD^)
          fi
          changed=$(git diff --name-only "$before" HEAD)
          echo "Changed files:"; echo "$changed"

          # Meta-only merges (docs, workflows, k8s manifests, markdown)
          # don't cut a release.
          code=$(grep -vE '^(\.github/|docs-site/|k8s/|graphify-out/)|\.md$' <<< "$changed" || true)
          if [ -z "$code" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No app-code changes — skipping release."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if grep -qx 'VERSION' <<< "$changed"; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "VERSION was bumped in the merge — tagging it as-is."
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "VERSION untouched — bumping patch version."
          fi

      - name: Bump patch version
        if: steps.decide.outputs.skip == 'false' && steps.decide.outputs.bump == 'true'
        run: |
          IFS=. read -r major minor patch < VERSION
          new_version="$major.$minor.$((patch + 1))"
          echo "$new_version" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump VERSION to $new_version"
          git push origin HEAD:master

      - name: Create and push tag
        if: steps.decide.outputs.skip == 'false'
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Created and pushed $tag." >> "$GITHUB_STEP_SUMMARY"
