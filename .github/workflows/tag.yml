# Tag-on-version-change: a release happens only when a push to master
# changes the VERSION file. The version in that file is tagged as-is
# (v<VERSION>); pushes that don't touch VERSION never tag. A GitHub
# Release with auto-generated notes is then published for that tag.
#
# The tag is pushed with the workflow's own GITHUB_TOKEN. Events created
# by GITHUB_TOKEN pushes do NOT trigger other workflows, so the tag push
# alone would never start build.yml — the last step therefore dispatches
# build.yml explicitly on the new tag (workflow_dispatch is the documented
# exception that GITHUB_TOKEN is allowed to trigger).
name: tag

on:
  push:
    branches:
      - master
    paths:
      - VERSION

permissions: {}

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release from VERSION
    if: github.repository_owner == 'sharanvelu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: push the tag + create the release; actions: dispatch build.yml.
      contents: write
      actions: write
    steps:
      - name: Checkout
        # Credentials persist deliberately: this job pushes the tag.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and push tag from VERSION
        id: tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'$version' is not a valid semver version — not tagging."
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists — nothing to do."
            echo "VERSION changed but $tag already exists — no new tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Created and pushed $tag." >> "$GITHUB_STEP_SUMMARY"

      # Runs whenever VERSION's tag exists without a GitHub Release, so a
      # failed release step can be fixed by re-running the workflow even
      # though the tag (and therefore the build dispatch) already happened.
      # Notes are generated by GitHub from merged PRs since the previous
      # semver tag, grouped per .github/release.yml.
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Previous release = highest semver tag below this one (stray
          # out-of-order tags sort lower and are never chosen over it).
          previous=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' \
            | { cat; echo "$tag"; } | sort -uV | grep -B1 -x "$tag" | grep -vx "$tag" || true)
          args=(--repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes --verify-tag)
          if [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$tag" "${args[@]}"
          echo "Created release $tag (notes since ${previous:-the first commit})." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch image build for the new tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched build.yml for $TAG." >> "$GITHUB_STEP_SUMMARY"
