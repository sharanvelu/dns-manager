# PR title lint: enforces Conventional Commits format on PR titles
# (e.g. "feat: add DNSSEC toggle", "fix(connectors): technitium TXT quoting").
# With squash-merge, the PR title becomes the commit message on master, so
# this keeps master's history machine-parseable for changelogs/releases.
# Runs on `edited` too, so fixing the title re-runs the check.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - master

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate title against Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
