; Pool override — loaded after the stock www.conf (zz- prefix wins).
; php-fpm master runs as www-data (non-root), so the user/group
; directives from www.conf are ignored with a harmless notice.

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Ship worker output (Laravel stderr log channel) to container logs
catch_workers_output = yes
decorate_workers_output = no

; Keep Kubernetes-injected env vars visible to PHP
clear_env = no

; Health/status for local debugging (not exposed via nginx)
pm.status_path = /-/fpm-status
ping.path = /-/fpm-ping
