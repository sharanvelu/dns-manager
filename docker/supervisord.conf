; Default container role: php-fpm + nginx, plus the queue worker and
; scheduler so a single container is fully functional out of the box.
; SUPERVISOR_WORKER / SUPERVISOR_SCHEDULER (true|false, defaulted by the
; entrypoint) turn the background programs off — set them to false on
; Kubernetes where dedicated worker/scheduler Deployments run instead.
; All logs go to the container's stdout/stderr. Runs as www-data.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT

[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --tries=3 --max-time=3600 --sleep=3
autostart=%(ENV_SUPERVISOR_WORKER)s
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=60
stopsignal=TERM

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=%(ENV_SUPERVISOR_SCHEDULER)s
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
