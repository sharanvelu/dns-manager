# nginx runs as a non-root user (www-data) under supervisord.
# All writable paths (pid, temp) point at locations www-data can write.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # Non-root friendly temp paths
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    server {
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # nginx-generated redirects (/docs -> /docs/, directory slashes under
        # the static docs) must stay relative: absolute ones would embed the
        # internal :8080 listen port and http scheme, which breaks behind the
        # TLS-terminating ingress/proxy.
        absolute_redirect off;

        # Health endpoint (Laravel serves /up; keep noise out of logs)
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # Vite-built assets are content-hashed -> cache forever
        location /build/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Static documentation site (docs-site/ export, baked into the image
        # at public/docs). Only /docs is exposed; everything else stays with
        # the Laravel app.
        location = /docs { return 301 /docs/; }

        location ^~ /docs/ {
            index index.html;
            error_page 404 /docs/404.html;
            try_files $uri $uri/ =404;
        }

        # Laravel front controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;

            # Laravel's Vite preload middleware emits a Link header per asset
            # chunk (~4KB+ on chunk-heavy pages). The default buffer is one
            # memory page (4k on x86), which 502s with
            # "upstream sent too big header".
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_busy_buffers_size 64k;
        }

        # Deny access to hidden files (except .well-known)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
